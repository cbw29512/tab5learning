name: Tab5 Firmware Core and USB Protocol Tests
on:
  pull_request:
    paths:
      - "firmware/include/**"
      - "firmware/src/**"
      - "firmware/platformio.ini"
      - "firmware/tests/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/ink-core-tests.yml"
  push:
    paths:
      - "firmware/include/**"
      - "firmware/src/**"
      - "firmware/platformio.ini"
      - "firmware/tests/**"
      - "tools/**"
      - "tests/**"

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run portable C++ ink buffer tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -Ifirmware/include \
            firmware/src/ink_capture.cpp \
            firmware/tests/ink_capture_test.cpp \
            -o /tmp/tab5-ink-test
          /tmp/tab5-ink-test
      - name: Compile and run learner navigation tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include firmware/tests/learner_navigation_test.cpp -o /tmp/tab5-navigation-test
          /tmp/tab5-navigation-test
      - name: Compile and run achievement notification tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include firmware/tests/award_notice_test.cpp -o /tmp/tab5-award-notice-test
          /tmp/tab5-award-notice-test
      - name: Compile and run landscape layout tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include firmware/tests/learner_layout_test.cpp -o /tmp/tab5-layout-test
          /tmp/tab5-layout-test
      - name: Compile and run mathematics and checkpoint tests
        run: |
          for suite in math_practice math_checkpoint preview_badges; do
            g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include "firmware/tests/${suite}_test.cpp" -o "/tmp/${suite}-test"
            "/tmp/${suite}-test" || exit 1
          done
      - name: Compile and run scratchpad layout tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include firmware/src/ink_capture.cpp firmware/tests/math_scratchpad_test.cpp -o /tmp/tab5-scratchpad-test
          /tmp/tab5-scratchpad-test
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/include firmware/src/ink_capture.cpp firmware/tests/math_attempt_test.cpp -o /tmp/tab5-attempt-test
          /tmp/tab5-attempt-test
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run USB protocol parser and mock serial tests
        run: python -m unittest discover -s tests -v
