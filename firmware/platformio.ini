[env:esp32p4_pioarduino]
; Based on M5Stack's documented Tab5 PlatformIO example.
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
framework = arduino
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
upload_speed = 1500000
monitor_speed = 115200
build_type = debug
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    https://github.com/M5Stack/M5Unified.git
    https://github.com/M5Stack/M5GFX.git

[env:learner_preview]
extends = env:esp32p4_pioarduino
build_flags = ${env:esp32p4_pioarduino.build_flags} -DPOCKET_LEARNER_PREVIEW
build_src_filter = -<*> +<learner_main.cpp> +<ink_capture.cpp> +<learner_usb_identity.cpp>

; Isolated candidate dependencies: do not change learner_preview until verified.
[env:mic_compile_probe]
extends = env:esp32p4_pioarduino
build_flags = ${env:esp32p4_pioarduino.build_flags} -DPOCKET_MIC_COMPILE_PROBE
build_src_filter = -<*> +<mic_compile_probe.cpp>
lib_deps =
    https://github.com/M5Stack/M5Unified.git#96576a14247ddc935149145aa6b51943464120f1
    https://github.com/M5Stack/M5GFX.git#28d47949bdc84f30881623476f555398e2194313

; Physical Tab5 baseline: build only until backup and layout match are verified.
; Never mount or format the existing model partition during preview.
[env:learner_factory_preview]
extends = env:learner_preview
board_build.partitions = partitions_tab5_existing.csv
board_upload.maximum_size = 4194304
lib_deps =
    https://github.com/M5Stack/M5Unified.git#96576a14247ddc935149145aa6b51943464120f1
    https://github.com/M5Stack/M5GFX.git#28d47949bdc84f30881623476f555398e2194313

; Developer-only A/B display test. No learner storage or charger changes.
[env:display_recovery_probe]
extends = env:learner_factory_preview
build_flags = ${env:esp32p4_pioarduino.build_flags} -DPOCKET_DISPLAY_RECOVERY_PROBE
build_src_filter = -<*> +<display_recovery_probe.cpp>

; Build only: isolated synthetic crypto test, never a learner release.
[env:auth_compile_probe]
extends = env:learner_factory_preview
build_flags = ${env:esp32p4_pioarduino.build_flags} -DPOCKET_AUTH_COMPILE_PROBE
build_src_filter = -<*> +<auth_compile_probe.cpp> +<learner_mbedtls_auth.cpp> +<learner_nonce_drbg.cpp> +<learner_mbedtls_gcm.cpp>

; ISOLATED public-vector handshake probe, build only, never a learner release.
[env:auth_usb_probe]
extends = env:learner_factory_preview
build_flags = ${env:esp32p4_pioarduino.build_flags} -DPOCKET_AUTH_USB_PROBE
build_src_filter = -<*> +<auth_usb_probe.cpp> +<learner_mbedtls_auth.cpp> +<learner_nonce_drbg.cpp>

; Isolated encrypted public mathematics fixture; no learner storage or display writes.
[env:protected_usb_probe]
extends = env:learner_factory_preview
build_flags = ${env:esp32p4_pioarduino.build_flags} -DPOCKET_PROTECTED_USB_PROBE
build_src_filter = -<*> +<protected_usb_probe.cpp> +<learner_mbedtls_auth.cpp> +<learner_mbedtls_gcm.cpp> +<learner_nonce_drbg.cpp> +<ink_capture.cpp>

; Isolated SD capacity candidate; never upload as a learner release.
[env:sd_capacity_probe]
extends = env:learner_factory_preview
build_flags = ${env:esp32p4_pioarduino.build_flags} -DPOCKET_SD_CAPACITY_PROBE
build_src_filter = -<*> +<sd_capacity_probe.cpp>

; Isolated synthetic SD write qualification; not learner firmware.
[env:sd_write_probe]
extends = env:learner_factory_preview
build_flags = ${env:esp32p4_pioarduino.build_flags} -DPOCKET_SD_WRITE_PROBE
build_src_filter = -<*> +<sd_write_probe.cpp>
